name: Maven CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

permissions:
  contents: read
  checks: write

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run Integration Tests (Failsafe)
        run: mvn clean verify

      - name: Test Report
        id: test-report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: API Integration Tests
          path: target/failsafe-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
          use-actions-summary: true

      - name: Upload Failsafe HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failsafe-html-report
          path: target/site
          if-no-files-found: ignore

      - name: Upload Raw Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failsafe-reports
          path: target/failsafe-reports
          if-no-files-found: ignore